{% extends "account/base_auth.html" %}
{% load i18n %}

{% block title %}Mot de passe modifié{% endblock %}

{% block main %}
    <div class="rounded-lg px-6 py-8 max-w-lg mx-auto w-full md:px-8 lg:max-w-md">
        <div class="mx-auto mb-6 flex h-14 w-14 items-center justify-center rounded-full bg-green-50">
            <svg class="size-7 text-green-600" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" d="m4.5 12.75 6 6 9-13.5" />
            </svg>
        </div>

        <h1 class="text-2xl mb-4 font-semibold text-center text-brand-title">Mot de passe modifié</h1>
        <p class="text-sm text-brand-text leading-relaxed text-center mb-8">
            Votre mot de passe a été mis à jour avec succès.
        </p>

        <a href="{% url 'gestion:post_login_redirect' %}"
            class="block text-center w-full py-2 px-3.5 text-sm rounded-md font-semibold tracking-wide text-white border border-brand-primary bg-brand-primary hover:bg-brand-primary-hover transition-all focus:outline-none focus-visible:ring-2 focus-visible:ring-brand-primary">
            Retour à l'espace de gestion
        </a>
    </div>
{% endblock main %}

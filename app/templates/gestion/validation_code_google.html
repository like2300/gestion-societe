<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Validation de votre accès</title>
    <style>
        :root { color-scheme: light; }
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 20px;
            font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
            background: #f1f5f9; color: #0f172a; }
        .boite { width: 100%; max-width: 420px; padding: 32px 28px; border-radius: 22px;
            background: #fff; box-shadow: 0 24px 70px -30px rgba(15,23,42,.45); text-align: center; }
        .ico { width: 56px; height: 56px; margin: 0 auto 14px; display: grid; place-items: center;
            border-radius: 16px; background: #0284c7; color: #fff; font-size: 1.5rem; }
        h1 { margin: 0 0 8px; font-size: 1.25rem; }
        p { margin: 0 0 20px; color: #64748b; font-size: .92rem; line-height: 1.5; }
        input { width: 100%; height: 54px; padding: 0 12px; border: 1px solid #cbd5e1;
            border-radius: 12px; font: 600 1.5rem/1 system-ui, sans-serif; text-align: center;
            letter-spacing: .45em; color: #0f172a; }
        input:focus { outline: 3px solid rgba(2,132,199,.2); border-color: #0284c7; }
        .btn { width: 100%; height: 48px; margin-top: 14px; border: 0; border-radius: 12px;
            background: #0284c7; color: #fff; font: 600 .95rem system-ui, sans-serif; cursor: pointer; }
        .btn.secondaire { margin-top: 10px; background: #e2e8f0; color: #334155; }
        .err { margin-top: 14px; padding: 10px 12px; border-radius: 10px; color: #b91c1c;
            background: #fee2e2; font-size: .85rem; }
        .ok { margin-bottom: 16px; padding: 10px 12px; border-radius: 10px; color: #047857;
            background: #d1fae5; font-size: .85rem; }
        .sortie { display: block; margin-top: 16px; color: #64748b; font-size: .82rem; }
    </style>
</head>
<body>
    <main class="boite">
        <div class="ico" aria-hidden="true">&#128274;</div>
        <h1>Validez votre accès</h1>
        <p>Saisissez le code à 6 chiffres envoyé par e-mail à {{ user.email }}.</p>

        {% if messages %}
            {% for message in messages %}<div class="ok">{{ message }}</div>{% endfor %}
        {% endif %}
        {% if erreur %}<div class="err" role="alert">{{ erreur }}</div>{% endif %}

        <form method="post">
            {% csrf_token %}
            <input name="code" type="text" inputmode="numeric" pattern="[0-9]{6}"
                   maxlength="6" autocomplete="one-time-code" required autofocus
                   aria-label="Code de validation à 6 chiffres" placeholder="000000">
            <button class="btn" type="submit">Valider et continuer</button>
        </form>

        <form method="post">
            {% csrf_token %}
            <input type="hidden" name="action" value="renvoyer">
            <button class="btn secondaire" type="submit">Renvoyer le code</button>
        </form>

        <form method="post" action="{% url 'account_logout' %}">
            {% csrf_token %}
            <button class="sortie" type="submit">Se déconnecter</button>
        </form>
    </main>
</body>
</html>

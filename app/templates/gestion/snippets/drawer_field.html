<div class="ffield {% if span %}fspan-2{% endif %}">
    <label for="{{ field.id_for_label }}">{{ field.label }}
        {% if field.field.required %}<span class="req">*</span>{% endif %}
    </label>
    {{ field }}
    {% if field.errors %}
        <ul class="errors">
            {% for error in field.errors %}<li>{{ error }}</li>{% endfor %}
        </ul>
    {% endif %}
</div>

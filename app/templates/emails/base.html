<!doctype html>
<html lang="fr">
<body style="margin:0;padding:0;background:#f4f6fb;font-family:Segoe UI,Helvetica,Arial,sans-serif;color:#0f172a">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f6fb;padding:32px 12px">
    <tr><td align="center">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;background:#ffffff;border-radius:18px;overflow:hidden;border:1px solid #e5e9f2">
        {# En-tête : logo de la plateforme + identité de la société à l'origine du mail #}
        <tr><td style="padding:20px 28px;border-bottom:1px solid #e5e9f2;background:#ffffff">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
            <tr>
              <td align="left" style="vertical-align:middle">
                {% if email_logo_app %}
                  <img src="{{ email_logo_app }}" alt="Archi" height="34" style="display:block;max-height:34px;border:0">
                {% else %}
                  <span style="font-size:20px;font-weight:800;color:#0f172a">Archi</span>
                {% endif %}
              </td>
              <td align="right" style="vertical-align:middle">
                {% if email_logo_societe %}
                  <img src="{{ email_logo_societe }}" alt="" height="34" style="display:inline-block;max-height:34px;max-width:110px;border:0;vertical-align:middle">
                {% endif %}
                <span style="margin-left:8px;font-size:14px;font-weight:700;color:#334155;vertical-align:middle">{{ email_nom_societe }}</span>
              </td>
            </tr>
          </table>
        </td></tr>
        <tr><td style="padding:28px">{% block contenu %}{% endblock %}</td></tr>
        <tr><td style="padding:16px 28px;background:#f8fafc;font-size:12px;color:#94a3b8">
          Message envoyé par {{ email_nom_societe }} sur Archi.
        </td></tr>
      </table>
    </td></tr>
  </table>
</body>
</html>

{% extends "account/base_auth.html" %}
{% load i18n %}

{% block title %}Erreur de connexion{% endblock %}

{% block main %}
    <div class="rounded-lg px-6 py-8 max-w-lg mx-auto w-full md:px-8 lg:max-w-md">
        <div class="mx-auto mb-6 flex h-14 w-14 items-center justify-center rounded-full bg-red-50">
            <svg class="size-7 text-red-600" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126ZM12 15.75h.007v.008H12v-.008Z" />
            </svg>
        </div>

        <h1 class="text-2xl mb-4 font-semibold text-center text-brand-title">Erreur de connexion</h1>
        <p class="text-sm text-brand-text leading-relaxed text-center mb-8">
            Une erreur s'est produite lors de la tentative de connexion avec Google.
            Veuillez réessayer.
        </p>

        <a href="{% url 'account_login' %}"
            class="block text-center w-full py-2 px-3.5 text-sm rounded-md font-semibold tracking-wide text-white border border-brand-primary bg-brand-primary hover:bg-brand-primary-hover transition-all focus:outline-none focus-visible:ring-2 focus-visible:ring-brand-primary btn-return">
            Retour à la connexion
        </a>
    </div>
{% endblock main %}
